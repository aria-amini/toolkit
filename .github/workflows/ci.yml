name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  packages:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: voidzero-dev/setup-vp@v1
        with:
          version: '1.1.0'
          node-version-file: .node-version
          cache: true
      - run: vp check
      - run: vp test run
      - run: vp run build
      - name: Smoke-test the aamini bin
        run: packages/config/dist/bootstrap/cli.mjs bootstrap --help
