name: Templates

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: templates-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  render:
    name: render (${{ matrix.template }}, features=${{ matrix.features }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        template: [tanstack]
        features: [false, true]
        include:
          - template: astro
            features: false
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - name: Render the template
        run: |
          uvx --from copier==9.18.2 copier copy \
          --trust --skip-tasks --defaults --quiet \
          --vcs-ref="${{ github.sha }}" \
          -d template=${{ matrix.template }} \
          -d app_name=scaffold-check \
          -d sentry=${{ matrix.features }} \
          -d sentry_org=scaffold-check \
          -d sentry_dsn=https://public@o0.ingest.us.sentry.io/0 \
          -d posthog=${{ matrix.features }} \
          -d posthog_project_token=phc_scaffold_check \
          -d google_auth=${{ matrix.features }} \
          -d google_client_id=fixture.apps.googleusercontent.com \
          . "$RUNNER_TEMP/app"
      - uses: voidzero-dev/setup-vp@v1
        with:
          version: '1.1.0'
          node-version-file: .node-version
          working-directory: ${{ runner.temp }}/app
          run-install: false
      # Rendered apps test against this commit's @aamini/config, not npm.
      - name: Pack @aamini/config
        run: |
          vp install
          vp run build
          pnpm --dir packages/config pack --out "$RUNNER_TEMP/aamini-config.tgz"
      # A full install, so the app's prepare script runs; vp add skips it.
      - name: Install dependencies
        working-directory: ${{ runner.temp }}/app
        run: |
          npm pkg set "devDependencies.@aamini/config=file:$RUNNER_TEMP/aamini-config.tgz"
          vp install --no-frozen-lockfile
      - name: Install Chromium
        working-directory: ${{ runner.temp }}/app
        run: vp exec playwright install chromium --with-deps --no-shell
      - name: Validate the generated app
        working-directory: ${{ runner.temp }}/app
        run: |
          vp run check
          vp test run
          # Templates never deploy, so build with what bootstrap writes locally.
          APP_ENV=development APP_PORT=3000 BASE_URL=http://localhost:3000 vp run build
